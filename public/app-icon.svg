<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="40%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Top Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="url(#glossGrad)" stroke-width="6"/>

  <!-- Radial Light Center -->
  <circle cx="256" cy="220" r="160" fill="#60a5fa" opacity="0.18" filter="url(#glow)"/>

  <!-- Main Certification & Academic Emblem Group -->
  <g filter="url(#shadow)">
    <!-- Certificate Shield / Document Base -->
    <path d="M146 150 C146 138, 156 128, 168 128 L344 128 C356 128, 366 138, 366 150 L366 352 C366 358, 361 364, 354 362 L256 328 L158 362 C151 364, 146 358, 146 352 Z" fill="#ffffff" opacity="0.96"/>
    
    <!-- Inner Certificate Lines (Text Lines) -->
    <rect x="186" y="196" width="140" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="186" y="224" width="140" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="186" y="252" width="90" height="12" rx="6" fill="#cbd5e1"/>

    <!-- Premium Golden Seal on Certificate -->
    <circle cx="256" cy="316" r="32" fill="url(#goldGrad)" filter="url(#glow)"/>
    <circle cx="256" cy="316" r="26" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>
    <!-- Seal Star -->
    <path d="M256 296 L261 310 L276 312 L264 322 L268 336 L256 328 L244 336 L248 322 L236 312 L251 310 Z" fill="#ffffff"/>
    
    <!-- Red Ribbon Tails below Seal -->
    <path d="M246 338 L238 376 L252 368 L256 376 L248 338 Z" fill="url(#ribbonGrad)"/>
    <path d="M266 338 L274 376 L260 368 L256 376 L264 338 Z" fill="url(#ribbonGrad)"/>

    <!-- Modern Graduation Cap (Mortarboard) - Floating Top -->
    <!-- Diamond Cap Top -->
    <path d="M256 88 L392 144 L256 200 L120 144 Z" fill="#1e293b"/>
    <!-- Highlight on Cap Diamond Edge -->
    <path d="M256 94 L380 144 L256 194 L132 144 Z" fill="#334155"/>
    <path d="M256 96 L256 192" stroke="#475569" stroke-width="2" opacity="0.5"/>

    <!-- Cap Skull Cap / Base -->
    <path d="M166 166 L166 214 C166 248, 346 248, 346 214 L346 166 Z" fill="#0f172a"/>

    <!-- Golden Tassel & Button -->
    <ellipse cx="256" cy="144" rx="8" ry="6" fill="url(#goldGrad)"/>
    <path d="M256 144 C280 148, 310 165, 316 192" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M312 192 L320 192 L324 230 C324 232, 308 232, 308 230 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Sparkling Success Stars (Gamification & AI) -->
  <!-- Big Top-Right Sparkle -->
  <path d="M396 90 Q396 114, 420 114 Q396 114, 396 138 Q396 114, 372 114 Q396 114, 396 90 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Left Sparkle -->
  <path d="M106 200 Q106 218, 124 218 Q106 218, 106 236 Q106 218, 88 218 Q106 218, 106 200 Z" fill="url(#goldGrad)"/>

  <!-- Bottom Right Mini Sparkle -->
  <circle cx="410" cy="390" r="8" fill="#67e8f9" filter="url(#glow)"/>
</svg>
